<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Aura exterior de velocidad (Amarillo vibrante) -->
  <circle cx="50" cy="50" r="45" fill="#ffea00" opacity="0.3" />
  
  <!-- Esfera principal -->
  <circle cx="50" cy="50" r="35" fill="#ff9900" />
  
  <!-- Anillo exterior tecnológico con guiones (aerodinámico) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 4" opacity="0.8" />

  <!-- Icono: Tres flechas veloces hacia arriba (Chevrons) con estela -->
  <!-- Flecha superior -->
  <polygon points="50,22 66,38 58,38 50,30 42,38 34,38" fill="#ffffff" />
  <!-- Flecha intermedia -->
  <polygon points="50,37 66,53 58,53 50,45 42,53 34,53" fill="#ffffff" />
  <!-- Flecha inferior -->
  <polygon points="50,52 66,68 58,68 50,60 42,68 34,68" fill="#ffffff" opacity="0.8" />

  <!-- Pequeñas estelas o chispas de velocidad en la parte trasera -->
  <line x1="42" y1="73" x2="42" y2="79" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <line x1="50" y1="75" x2="50" y2="83" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="58" y1="73" x2="58" y2="79" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>