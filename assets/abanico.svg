<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Aura exterior de dispersión -->
  <circle cx="50" cy="50" r="45" fill="#00ffcc" opacity="0.3" />
  
  <!-- Esfera principal turquesa -->
  <circle cx="50" cy="50" r="35" fill="#00cc99" />
  
  <!-- Anillo tecnológico (línea punteada) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 3" opacity="0.8" />
  
  <!-- Icono: Tres disparos en abanico (\ | /) -->
  <!-- Disparo central -->
  <polygon points="50,22 55,42 50,38 45,42" fill="#ffffff" />
  <rect x="48" y="42" width="4" height="20" rx="1" fill="#ffffff" />
  
  <!-- Disparo izquierdo (rotado) -->
  <g transform="translate(50,55) rotate(-30) translate(-50,-55)">
    <polygon points="50,22 55,42 50,38 45,42" fill="#ffffff" />
    <rect x="48" y="42" width="4" height="20" rx="1" fill="#ffffff" />
  </g>
  
  <!-- Disparo derecho (rotado) -->
  <g transform="translate(50,55) rotate(30) translate(-50,-55)">
    <polygon points="50,22 55,42 50,38 45,42" fill="#ffffff" />
    <rect x="48" y="42" width="4" height="20" rx="1" fill="#ffffff" />
  </g>
  
  <!-- Punto de origen de la energía (abajo en el centro) -->
  <circle cx="50" cy="62" r="5" fill="#ffffff" />
</svg>