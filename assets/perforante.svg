<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Aura exterior de alta energía -->
  <circle cx="50" cy="50" r="45" fill="#ffcc00" opacity="0.4" />
  
  <!-- Esfera principal dorada -->
  <circle cx="50" cy="50" r="35" fill="#ffaa00" />
  
  <!-- Anillo tecnológico (línea punteada) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  
  <!-- Icono: Flecha/Proyectil rompiendo la defensa -->
  <polygon points="50,20 65,45 55,45 55,70 45,70 45,45 35,45" fill="#ffffff" />
  
  <!-- Icono: Barrera de armadura rota -->
  <rect x="23" y="32" width="15" height="4" fill="#ffffff" />
  <rect x="62" y="32" width="15" height="4" fill="#ffffff" />
  
  <!-- Pedazos de armadura saltando por el impacto -->
  <polygon points="38,20 41,23 38,26 35,23" fill="#ffffff" />
  <polygon points="62,20 65,23 62,26 59,23" fill="#ffffff" />
</svg>